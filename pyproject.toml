[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "faultopt"
version = "0.1.0"
description = "Bounded synthesis and fault-distance verification of quantum syndrome-extraction circuits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "stim>=1.16.0",
  "z3-solver>=4.16.0.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fto = "fto:main"

[tool.setuptools]
py-modules = [
  "cegis", "codes", "f2", "fto", "grader", "inject", "mim", "mim_gpu",
  "scoring", "spectrum", "synth", "viz", "webs",
]
